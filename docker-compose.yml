
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam_local
      POSTGRES_DB: amrutam
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amrutam -d amrutam']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://amrutam:amrutam_local@postgres:5432/amrutam?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports: ['3000:3000']
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  migrate:
    build:
      context: .
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://amrutam:amrutam_local@postgres:5432/amrutam?schema=public
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
