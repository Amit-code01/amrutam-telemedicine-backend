name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: amrutam
          POSTGRES_PASSWORD: amrutam_local
          POSTGRES_DB: amrutam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U amrutam -d amrutam_test'
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://amrutam:amrutam_local@localhost:5432/amrutam_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      NODE_ENV: test
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
